[project]
name = "RecuperaBit"
version = "1.1.6.post1"
description = "Reconstruct file system structures and recover files from damaged NTFS volumes."
readme = "README.md"
authors = [
    { name = "Andrea Lazzarotto", email = "andrea.lazzarotto@gmail.com" },
]
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Lazza/RecuperaBit"
Repository = "https://github.com/Lazza/RecuperaBit"
Issues = "https://github.com/Lazza/RecuperaBit/issues"

[project.scripts]
recuperabit = "recuperabit.cli:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"
